<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing Guard</title>
<style>
  :root {
    --bg: #f5f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --accent: #2f5bd3; --ok: #1f7a4d; --ok-bg: #e5f4ec; --warn: #9a6400; --warn-bg: #fdf1dc;
    --bad: #b3261e; --bad-bg: #fbe7e5; --fill: #eef3ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecece7; --muted: #9a9a93; --line: #34342f;
      --accent: #7c9cff; --ok: #6fd3a0; --ok-bg: #16301f; --warn: #f0c060; --warn-bg: #33280f;
      --bad: #ff8a80; --bad-bg: #3a1a17; --fill: #1d2640;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 24px 8px; max-width: 1180px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px;
         padding: 16px 24px 40px; max-width: 1180px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; } header { padding: 16px 16px 4px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 16px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 14px; }
  label small { font-weight: 400; color: var(--muted); }
  input[type=text], textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--panel); color: var(--ink); font: inherit; }
  textarea { min-height: 84px; resize: vertical; }
  input[type=file] { width: 100%; font-size: 13px; color: var(--muted); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .thumbs figure { margin: 0; position: relative; }
  .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .thumbs figcaption { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,.6); color: #fff;
         font-size: 11px; padding: 1px 6px; border-radius: 6px; }
  .thumbs .flag { outline: 3px solid var(--bad); outline-offset: 1px; }
  audio, video { width: 100%; margin-top: 8px; }
  button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent);
         color: #fff; font: 600 15px inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .empty { color: var(--muted); }
  .verdict { border-radius: 10px; padding: 14px 16px; font-size: 18px; font-weight: 700; }
  .verdict small { display: block; font-size: 13px; font-weight: 400; margin-top: 2px; }
  .v-ok { background: var(--ok-bg); color: var(--ok); }
  .v-review { background: var(--warn-bg); color: var(--warn); }
  .v-not_ok { background: var(--bad-bg); color: var(--bad); }
  ul.reasons { margin: 10px 0 0; padding-left: 20px; }
  ul.reasons li.review { color: var(--warn); }
  ul.reasons li.reject { color: var(--bad); }
  h3 { font-size: 14px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .attr { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--fill); }
  .attr span { display: block; font-size: 12px; color: var(--muted); }
  .attr b { font-weight: 600; }
  blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .timings { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); margin-top: 12px; }
  details { margin-top: 18px; font-size: 13px; }
  pre { overflow-x: auto; background: var(--bg); padding: 10px; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>Listing Guard</h1>
  <p>Подача объявления: модерация текста, голоса, фото и видео + автозаполнение карточки.</p>
</header>
<main>
  <form class="panel" id="form">
    <h2>Новое объявление</h2>
    <label for="title">Название</label>
    <input type="text" id="title" name="title" placeholder="Basics Men Navy Shirt, size L">
    <label for="description">Описание</label>
    <textarea id="description" name="description" placeholder="Worn twice, no stains. Pickup downtown."></textarea>
    <label for="photos">Фото <small>до 10 штук</small></label>
    <input type="file" id="photos" name="photos" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <label for="audio">Голосовое описание <small>wav, mp3, m4a</small></label>
    <input type="file" id="audio" name="audio" accept="audio/*">
    <audio id="audioPreview" controls hidden></audio>
    <label for="video">Видео <small>люди в кадре будут размыты</small></label>
    <input type="file" id="video" name="video" accept="video/*">
    <button type="submit" id="submit">Опубликовать</button>
    <div class="error" id="error"></div>
  </form>

  <section class="panel" id="result">
    <h2>Результат проверки</h2>
    <p class="empty">Заполните объявление и нажмите «Опубликовать».</p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const VERDICT = {
  ok: ["✅ Можно публиковать", "Нарушений не найдено"],
  review: ["🟡 На ручную проверку", "Есть сомнительные места, решит модератор"],
  not_ok: ["⛔ Отклонено", "Найдены нарушения правил площадки"],
};
const ATTR = {articleType: "Тип", gender: "Пол", baseColour: "Цвет", season: "Сезон", usage: "Назначение"};
const STEP = {asr: "распознавание речи", text_moderation: "модерация текста", image_moderation: "модерация фото",
              video: "видео", attributes: "атрибуты (VLM)"};
let photoUrls = [];

$("photos").addEventListener("change", (e) => {
  photoUrls.forEach(URL.revokeObjectURL);
  photoUrls = [...e.target.files].map((f) => URL.createObjectURL(f));
  $("thumbs").innerHTML = photoUrls.map((u, i) =>
    `<figure><img src="${u}" id="thumb${i + 1}" alt=""><figcaption>${i + 1}</figcaption></figure>`).join("");
});
$("audio").addEventListener("change", (e) => {
  const f = e.target.files[0];
  $("audioPreview").hidden = !f;
  if (f) $("audioPreview").src = URL.createObjectURL(f);
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").textContent = "";
  $("submit").disabled = true;
  $("submit").textContent = "Проверяем…";
  $("result").innerHTML = '<h2>Результат проверки</h2><p class="empty">Модели работают, видео может занять несколько секунд…</p>';
  try {
    const res = await fetch("/v1/listings/check", {method: "POST", body: new FormData($("form"))});
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
    render(data);
  } catch (err) {
    $("error").textContent = "Ошибка: " + err.message;
    $("result").innerHTML = '<h2>Результат проверки</h2><p class="empty">—</p>';
  } finally {
    $("submit").disabled = false;
    $("submit").textContent = "Опубликовать";
  }
});

function render(r) {
  const [head, sub] = VERDICT[r.verdict];
  let html = `<h2>Результат проверки</h2><div class="verdict v-${r.verdict}">${head}<small>${sub}</small></div>`;
  const items = [...r.reasons.map((x) => ["reject", x]), ...r.review.map((x) => ["review", x])];
  if (items.length) html += `<ul class="reasons">${items.map(([c, x]) => `<li class="${c}">${esc(x)}</li>`).join("")}</ul>`;

  if (r.attributes) {
    html += `<h3>Карточка заполнена автоматически</h3><div class="attrs">` +
      Object.entries(r.attributes).map(([k, v]) => `<div class="attr"><span>${ATTR[k] || k}</span><b>${esc(v)}</b></div>`).join("") +
      `</div>`;
  } else if (r.attributes_error) {
    html += `<h3>Карточка</h3><p class="empty">Автозаполнение недоступно: ${esc(r.attributes_error)}</p>`;
  } else if (r.verdict === "not_ok") {
    html += `<h3>Карточка</h3><p class="empty">Не заполняется для отклонённого объявления.</p>`;
  }

  for (const [src, text] of Object.entries(r.transcripts || {})) {
    html += `<h3>Расшифровка: ${src === "audio" ? "голосовое" : "звук из видео"}</h3><blockquote>${esc(text)}</blockquote>`;
  }

  const photos = Object.entries(r.image_moderation || {});
  if (photos.length) {
    html += `<h3>Фото</h3><div class="chips">` + photos.map(([k, p]) =>
      `<span class="chip ${p.verdict === "not_ok" ? "bad" : ""}">${esc(k)}: ${esc(p.category)} · запрещённое ${Math.round(p.forbidden_score * 100)}%</span>`
    ).join("") + `</div>`;
    photos.forEach(([k, p], i) => $(`thumb${i + 1}`)?.classList.toggle("flag", p.verdict === "not_ok"));
  }

  if (r.video) {
    const v = r.video;
    html += `<h3>Видео после размытия</h3><p class="timings">Люди найдены в ${v.persons_frames} из ${v.frames} кадров, ` +
      `максимум ${v.max_persons_in_frame} в кадре</p><video src="${v.blurred}" controls muted playsinline></video>`;
  }

  html += `<h3>Время</h3><div class="timings">` + Object.entries(r.timings_s).map(([k, s]) =>
    `${STEP[k] || k}: ${s.toFixed(2)} с`).join(" · ") + `</div>`;
  html += `<details><summary>Полный ответ API</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>`;
  $("result").innerHTML = html;
}
</script>
</body>
</html>
