[project]
name = "listing-guard"
version = "0.1.0"
description = "Модерация объявлений готовыми ML-моделями: ASR, текст, изображения, видео, VLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.49",
    "pillow>=10.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "openai>=1.50",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listing_guard"]

[tool.ruff]
line-length = 100
